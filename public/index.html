<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RL Shop Matrix // Ultimate Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #03060c;
      --panel-bg: rgba(10, 16, 28, 0.85);
      --card-bg: #09111e;
      --neon-cyan: #00f3ff;
      --neon-purple: #8a2be2;
      --neon-discord: #5865f2;
      --neon-pink: #ff0055;
      --neon-orange: #ff5500;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --border-glow: rgba(0, 243, 255, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(at 0% 0%, rgba(138, 43, 226, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 243, 255, 0.1) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 25px 15px;
      overflow-x: hidden;
    }

    .app-container {
      max-width: 1450px;
      margin: 0 auto;
    }

    /* =========================================
       Navbar + Alien Animated Discord Button
       ========================================= */
    .cyber-navbar {
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      flex-wrap: wrap;
      gap: 20px;
    }

    .brand-title h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.9rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .brand-title p {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .nav-tools {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    /* --- Weird Futuristic Animated Discord Button --- */
    .discord-alien-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(88, 101, 242, 0.2), rgba(138, 43, 226, 0.2));
      border: 1px solid var(--neon-discord);
      color: #fff;
      padding: 10px 22px;
      border-radius: 12px;
      font-weight: 800;
      text-decoration: none;
      font-size: 0.9rem;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(88, 101, 242, 0.3);
    }

    /* Alien Pulse Scanner Effect */
    .discord-alien-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        transparent, 
        rgba(0, 243, 255, 0.4), 
        transparent 30%
      );
      animation: radarRotate 4s linear infinite;
      z-index: 1;
    }

    .discord-alien-btn::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: #090e17;
      border-radius: 10px;
      z-index: 2;
      transition: background 0.3s;
    }

    .discord-alien-btn span, .discord-alien-btn svg {
      position: relative;
      z-index: 3;
    }

    .discord-alien-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 30px var(--neon-discord), 0 0 10px var(--neon-cyan);
    }

    .discord-alien-btn:hover::after {
      background: rgba(88, 101, 242, 0.3);
    }

    @keyframes radarRotate {
      100% { transform: rotate(360deg); }
    }

    .timer-badge {
      background: rgba(255, 85, 0, 0.08);
      border: 1px solid rgba(255, 85, 0, 0.3);
      color: var(--neon-orange);
      padding: 8px 18px;
      border-radius: 12px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .lang-btn {
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 9px 20px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }
    .lang-btn:hover {
      background: var(--neon-cyan);
      color: var(--bg-main);
      box-shadow: 0 0 15px var(--neon-cyan);
    }

    /* =========================================
       Tabs & Main Grid
       ========================================= */
    .filter-bar {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 15px;
      margin-bottom: 25px;
      scrollbar-width: thin;
      scrollbar-color: var(--neon-cyan) var(--panel-bg);
    }

    .tab-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border-glow);
      color: var(--text-muted);
      padding: 10px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.3s;
    }

    .tab-btn:hover, .tab-btn.active {
      background: rgba(0, 243, 255, 0.1);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    .shop-matrix {
      display: flex;
      flex-direction: column;
      gap: 35px;
    }

    .section-card {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 25px;
    }

    .section-title {
      font-size: 1.25rem;
      color: var(--neon-cyan);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px dashed var(--border-glow);
      padding-bottom: 10px;
      font-weight: 700;
    }

    .section-title span.count {
      background: rgba(0, 243, 255, 0.1);
      color: var(--neon-cyan);
      font-size: 0.8rem;
      padding: 2px 10px;
      border-radius: 6px;
      font-family: 'Orbitron', sans-serif;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .item-card:hover {
      transform: translateY(-6px);
      border-color: var(--neon-pink);
      box-shadow: 0 10px 25px rgba(255, 0, 85, 0.25);
    }

    .media-holder {
      width: 100%;
      height: 170px;
      background: #000;
    }

    .media-holder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-grow: 1;
      justify-content: space-between;
      text-align: right;
    }
    body[dir="ltr"] .card-body { text-align: left; }

    .item-name {
      font-size: 0.98rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-cat {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-family: 'Orbitron', sans-serif;
    }

    .price-badge {
      align-self: flex-start;
      background: linear-gradient(135deg, var(--neon-orange), var(--neon-pink));
      color: #fff;
      font-weight: 800;
      font-family: 'Orbitron', sans-serif;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .status-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 80px;
      font-size: 1.1rem;
      font-family: 'Orbitron', sans-serif;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Navbar -->
    <header class="cyber-navbar">
      <div class="brand-title">
        <h1 id="app-title">RL SHOP MATRIX</h1>
        <p id="app-subtitle">نظام المراقبة والتحليل الحي لمتجر روكيت ليغ</p>
      </div>

      <div class="nav-tools">
        <!-- زر الديسكورد بأنيميشن غريب وعصري -->
        <a href="https://discord.gg/eSQUPtxndv" target="_blank" class="discord-alien-btn">
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path d="M13.545 2.907a13.227 13.227 0 0 0-3.257-1.011.05.05 0 0 0-.052.025c-.141.25-.297.577-.406.833a12.19 12.19 0 0 0-3.658 0 8.258 8.258 0 0 0-.412-.833.051.051 0 0 0-.052-.025c-1.125.194-2.22.534-3.257 1.011a.041.041 0 0 0-.021.018C.356 6.024-.213 9.047.066 12.032c.001.014.01.028.021.037a13.276 13.276 0 0 0 3.995 2.02.05.05 0 0 0 .056-.019c.308-.42.582-.863.818-1.329a.05.05 0 0 0-.01-.059.051.051 0 0 0-.018-.011 8.875 8.875 0 0 1-1.248-.595.05.05 0 0 1-.02-.066.051.051 0 0 1 .015-.019c.084-.063.168-.129.248-.195a.05.05 0 0 1 .051-.007c2.619 1.196 5.454 1.196 8.041 0a.052.052 0 0 1 .053.007c.08.066.164.132.248.195a.051.051 0 0 1-.004.085 8.254 8.254 0 0 1-1.249.594.05.05 0 0 0-.027.058c.237.468.511.91.819 1.329a.05.05 0 0 0 .056.019 13.235 13.235 0 0 0 4.001-2.02.049.049 0 0 0 .021-.037c.334-3.451-.559-6.449-2.366-9.106a.034.034 0 0 0-.02-.019Zm-8.198 7.307c-.789 0-1.438-.724-1.438-1.612 0-.889.637-1.613 1.438-1.613.807 0 1.45.73 1.438 1.613 0 .888-.637 1.612-1.438 1.612Zm5.316 0c-.788 0-1.438-.724-1.438-1.612 0-.889.637-1.613 1.438-1.613.807 0 1.451.73 1.438 1.613 0 .888-.631 1.612-1.438 1.612Z"/>
          </svg>
          <span id="discord-text">DISCORD SERVER</span>
        </a>

        <div class="timer-badge" id="countdown">--:--:--</div>
        <button class="lang-btn" onclick="toggleLanguage()" id="lang-btn">ENGLISH</button>
      </div>
    </header>

    <!-- Category Tabs -->
    <nav class="filter-bar" id="filter-tabs">
      <button class="tab-btn active" onclick="filterCategory('all', this)" id="tab-all">الكل / ALL</button>
    </nav>

    <!-- Shop Content Matrix -->
    <main class="shop-matrix" id="shop-container">
      <div class="status-msg" id="app-loading">جاري مزامنة بيانات المتجر...</div>
    </main>
  </div>

  <script>
    let currentLang = 'ar';
    let rawShopData = {};
    let activeFilter = 'all';

    const textDict = {
      ar: {
        title: "RL SHOP MATRIX",
        subtitle: "نظام المراقبة والتحليل الحي لمتجر روكيت ليغ",
        discordText: "سيرفر الديسكورد",
        loading: "جاري مزامنة بيانات المتجر...",
        empty: "لا توجد عناصر متاحة حالياً.",
        error: "تعذر الاتصال بخوادم المتجر.",
        allTab: "الكل / ALL",
        langBtn: "ENGLISH",
        items: "عنصر"
      },
      en: {
        title: "RL SHOP MATRIX",
        subtitle: "Live Rocket League Shop Tracker",
        discordText: "DISCORD SERVER",
        loading: "Syncing store data...",
        empty: "No items available right now.",
        error: "Failed to connect to shop servers.",
        allTab: "ALL ITEMS",
        langBtn: "عربي",
        items: "Items"
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      document.body.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      
      document.getElementById('app-title').innerText = textDict[currentLang].title;
      document.getElementById('app-subtitle').innerText = textDict[currentLang].subtitle;
      document.getElementById('discord-text').innerText = textDict[currentLang].discordText;
      document.getElementById('tab-all').innerText = textDict[currentLang].allTab;
      document.getElementById('lang-btn').innerText = textDict[currentLang].langBtn;
      
      renderMatrix();
    }

    async function fetchShopData() {
      try {
        const response = await fetch('/api/shop');
        if (!response.ok) throw new Error();
        const data = await response.json();
        
        if (data.categories) {
          rawShopData = data.categories;
        } else if (Array.isArray(data)) {
          rawShopData = { "العناصر اليومية / Featured Items": data };
        } else {
          rawShopData = data;
        }

        buildFilterTabs();
        renderMatrix();
      } catch (err) {
        document.getElementById('shop-container').innerHTML = `<div class="status-msg" style="color: var(--neon-pink);">${textDict[currentLang].error}</div>`;
      }
    }

    function groupItemsIntelligently(items) {
      const groups = {};
      
      items.forEach(item => {
        let name = (item.name || '').trim();
        let nameLower = name.toLowerCase();
        let subGroupName = "عنصر منفرد / General Item";

        const teamsList = [
          "Falcons", "NRG", "G2", "Vitality", "BDS", "Furia", "Complexity", 
          "Moist", "Karmine Corp", "Liquid", "Rule One", "Spacestation", 
          "FaZe", "OG", "Gen.G", "TSM", "Cloud9", "Oxygen", "Endpoint", "KRÜ"
        ];

        let foundTeam = teamsList.find(t => nameLower.includes(t.toLowerCase()));

        if (foundTeam) {
          subGroupName = `فريق ${foundTeam} / ${foundTeam}`;
        } else if (nameLower.includes("bundle") || nameLower.includes("pack")) {
          subGroupName = name;
        } else if (name.includes(":")) {
          subGroupName = name.split(":")[0].trim();
        } else if (item.category && item.category !== 'Item') {
          subGroupName = item.category;
        }

        if (!groups[subGroupName]) groups[subGroupName] = [];
        groups[subGroupName].push(item);
      });

      return groups;
    }

    function buildFilterTabs() {
      const tabsContainer = document.getElementById('filter-tabs');
      tabsContainer.innerHTML = `<button class="tab-btn ${activeFilter === 'all' ? 'active' : ''}" onclick="filterCategory('all', this)">${textDict[currentLang].allTab}</button>`;

      for (const sectionName of Object.keys(rawShopData)) {
        tabsContainer.innerHTML += `<button class="tab-btn ${activeFilter === sectionName ? 'active' : ''}" onclick="filterCategory('${sectionName}', this)">${sectionName}</button>`;
      }
    }

    function filterCategory(categoryName, btnElement) {
      activeFilter = categoryName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      renderMatrix();
    }

    function renderMatrix() {
      const container = document.getElementById('shop-container');
      if (!rawShopData || Object.keys(rawShopData).length === 0) {
        container.innerHTML = `<div class="status-msg">${textDict[currentLang].empty}</div>`;
        return;
      }

      container.innerHTML = '';

      const sectionsToRender = activeFilter === 'all' ? Object.entries(rawShopData) : [[activeFilter, rawShopData[activeFilter]]];

      for (const [sectionName, items] of sectionsToRender) {
        if (!Array.isArray(items)) continue;

        const subGroups = groupItemsIntelligently(items);

        for (const [subTitle, subItems] of Object.entries(subGroups)) {
          const cardsHtml = subItems.map(item => `
            <div class="item-card">
              <div class="media-holder">
                <img src="${item.image || 'https://via.placeholder.com/300x200?text=Rocket+League'}" alt="${item.name || 'Item'}">
              </div>
              <div class="card-body">
                <div>
                  <div class="item-name" title="${item.name || ''}">${item.name || 'Unknown'}</div>
                  <div class="item-cat">${item.category || ''}</div>
                </div>
                <div class="price-badge">${item.price || 0} CR</div>
              </div>
            </div>
          `).join('');

          const sectionDiv = document.createElement('div');
          sectionDiv.className = 'section-card';
          sectionDiv.innerHTML = `
            <div class="section-title">
              <span>✦ ${sectionName} ${subTitle !== "عنصر منفرد / General Item" ? `‹ ${subTitle}` : ''}</span>
              <span class="count">${subItems.length} ${textDict[currentLang].items}</span>
            </div>
            <div class="cards-grid">${cardsHtml}</div>
          `;
          
          container.appendChild(sectionDiv);
        }
      }
    }

    function startCountdown() {
      const timerElem = document.getElementById('countdown');
      setInterval(() => {
        const now = new Date();
        const nextReset = new Date();
        nextReset.setUTCHours(20, 0, 0, 0);
        if (now > nextReset) nextReset.setUTCDate(nextReset.getUTCDate() + 1);
        const diff = nextReset - now;
        const h = Math.floor((diff / (1000 * 60 * 60)) % 24).toString().padStart(2, '0');
        const m = Math.floor((diff / (1000 * 60)) % 60).toString().padStart(2, '0');
        const s = Math.floor((diff / 1000) % 60).toString().padStart(2, '0');
        timerElem.innerText = `${h}:${m}:${s}`;
      }, 1000);
    }

    fetchShopData();
    startCountdown();
  </script>
</body>
</html>
