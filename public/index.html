<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RL Shop Matrix - Ultimate Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-core: #030305;
      --panel-glass: rgba(12, 12, 20, 0.75);
      --border-neon: rgba(130, 80, 255, 0.25);
      --accent-purple: #8250ff;
      --accent-neon: #00ffcc;
      --accent-warning: #ffaa00;
      --text-main: #f8fafc;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background-color: var(--bg-core);
      background-image: 
        radial-gradient(circle at 0% 0%, rgba(130, 80, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(0, 255, 204, 0.08) 0%, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .app-layout {
      max-width: 1500px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 25px;
    }

    @media (max-width: 1024px) {
      .app-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Side Dashboard Controller */
    .side-controller {
      background: var(--panel-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-neon);
      border-radius: 24px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      height: fit-content;
      position: sticky;
      top: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .brand-area h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent-neon), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-area p {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 5px;
    }

    .hud-widget {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hud-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'Orbitron', sans-serif;
    }

    .server-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--accent-neon);
      font-family: 'Orbitron', sans-serif;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-neon);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-neon);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    .timer-box {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent-warning);
    }

    .lang-btn-cyber {
      background: linear-gradient(135deg, var(--accent-purple), #6020df);
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(130, 80, 255, 0.3);
      width: 100%;
    }

    .lang-btn-cyber:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    /* Main Content Area */
    .main-content {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    /* Horizontal Category Pills inside Main */
    .filter-pills {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-purple) transparent;
    }

    .tab-btn {
      background: var(--panel-glass);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.3s;
    }

    .tab-btn:hover, .tab-btn.active {
      background: rgba(130, 80, 255, 0.15);
      border-color: var(--accent-purple);
      color: var(--accent-neon);
      box-shadow: 0 0 15px rgba(130, 80, 255, 0.2);
    }

    .matrix-container {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .section-block {
      background: var(--panel-glass);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 25px;
    }

    .block-title {
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 12px;
    }

    .block-title span.title-text {
      color: var(--accent-neon);
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
    }

    .block-title span.count {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .items-matrix-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 18px;
    }

    /* Gaming Card Design */
    .gaming-card {
      background: rgba(18, 18, 28, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.3s ease;
    }

    .gaming-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-neon);
      box-shadow: 0 10px 25px rgba(0, 255, 204, 0.15);
    }

    .card-media {
      width: 100%;
      height: 160px;
      background: #000;
      position: relative;
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
      justify-content: space-between;
      text-align: right;
    }
    body[dir="ltr"] .card-content { text-align: left; }

    .item-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-category {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-family: 'Orbitron', sans-serif;
    }

    .item-price-badge {
      align-self: flex-start;
      background: linear-gradient(135deg, #ffaa00, #ff5500);
      color: #030305;
      font-weight: 900;
      font-family: 'Orbitron', sans-serif;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
    }

    .system-status-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 60px;
      font-size: 1rem;
      font-family: 'Orbitron', sans-serif;
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- لوحة التحكم الجانبية الجديدة (بدل الـ Navbar التقليدي) -->
    aside class="side-controller">
      <div class="brand-area">
        <h1 id="ui-title">RL MATRIX</h1>
        <p id="ui-subtitle">نظام المراقبة والتحليل الحي لمتجر روكيت ليغ</p>
      </div>

      <div class="hud-widget">
        <span class="hud-label" id="ui-status-label">حالة النظام</span>
        <div class="server-status">
          <span class="status-dot"></span>
          <span id="ui-status">LIVE SYNC ACTIVE</span>
        </div>
      </div>

      <div class="hud-widget">
        <span class="hud-label" id="ui-timer-label">التحديث القادم:</span>
        <div class="timer-box" id="countdown">00:00:00</div>
      </div>

      <button class="lang-btn-cyber" onclick="toggleLanguage()" id="lang-btn">ENGLISH</button>
    </aside>

    <!-- منطقة المحتوى والعرض -->
    <main class="main-content">
      <nav class="filter-pills" id="filter-tabs">
        <button class="tab-btn active" onclick="filterCategory('all', this)" id="tab-all">الكل / ALL</button>
      </nav>

      <div class="matrix-container" id="matrix-container">
        <div class="system-status-msg" id="ui-loading">جاري تهيئة مصفوفة المتجر وسحب البيانات...</div>
      </div>
    </main>
  </div>

  <script>
    let currentLang = 'ar';
    let rawShopData = {};
    let activeFilter = 'all';

    const textDict = {
      ar: {
        title: "RL MATRIX",
        subtitle: "نظام المراقبة والتحليل الحي لمتجر روكيت ليغ",
        status: "متصل وحي",
        timerLabel: "التحديث القادم:",
        statusLabel: "حالة النظام",
        loading: "جاري تهيئة مصفوفة المتجر وسحب البيانات...",
        empty: "لا توجد بيانات متاحة في المصفوفة حالياً.",
        error: "فشل الاتصال بنواة السيرفر.",
        allTab: "الكل / ALL",
        langBtn: "ENGLISH",
        items: "عنصر"
      },
      en: {
        title: "RL MATRIX",
        subtitle: "Live Rocket League Shop Matrix Tracker",
        status: "LIVE SYNC ACTIVE",
        timerLabel: "Next Reset:",
        statusLabel: "System Status",
        loading: "Initializing store matrix & fetching data...",
        empty: "No items available in the matrix right now.",
        error: "Failed to connect to core server.",
        allTab: "ALL ITEMS",
        langBtn: "عربي",
        items: "Items"
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      document.body.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      
      document.getElementById('ui-title').innerText = textDict[currentLang].title;
      document.getElementById('ui-subtitle').innerText = textDict[currentLang].subtitle;
      document.getElementById('ui-status').innerText = textDict[currentLang].status;
      document.getElementById('ui-timer-label').innerText = textDict[currentLang].timerLabel;
      document.getElementById('ui-status-label').innerText = textDict[currentLang].statusLabel;
      document.getElementById('tab-all').innerText = textDict[currentLang].allTab;
      document.getElementById('lang-btn').innerText = textDict[currentLang].langBtn;
      
      renderMatrix();
    }

    async function fetchShopData() {
      try {
        const response = await fetch('/api/shop');
        if (!response.ok) throw new Error();
        const data = await response.json();
        
        if (data.categories) {
          rawShopData = data.categories;
        } else if (Array.isArray(data)) {
          rawShopData = { "العناصر اليومية / Daily Featured": data };
        } else {
          rawShopData = data;
        }

        buildFilterTabs();
        renderMatrix();
      } catch (err) {
        document.getElementById('matrix-container').innerHTML = `<div class="system-status-msg" style="color: #ff0077;">${textDict[currentLang].error}</div>`;
      }
    }

    function groupItemsIntelligently(items) {
      const groups = {};
      
      items.forEach(item => {
        let name = (item.name || '').trim();
        let nameLower = name.toLowerCase();
        let subGroupName = "عنصر فردي / General";

        const teamsList = [
          "Falcons", "NRG", "G2", "Vitality", "BDS", "Furia", "Complexity", 
          "Moist", "Karmine Corp", "Liquid", "Rule One", "Spacestation", 
          "FaZe", "OG", "Gen.G", "TSM", "Cloud9", "Oxygen", "Endpoint", "KRÜ"
        ];

        let foundTeam = teamsList.find(t => nameLower.includes(t.toLowerCase()));

        if (foundTeam) {
          subGroupName = `فريق ${foundTeam} / ${foundTeam}`;
        } else if (nameLower.includes("bundle") || nameLower.includes("pack")) {
          subGroupName = name;
        } else if (name.includes(":")) {
          subGroupName = name.split(":")[0].trim();
        } else if (item.category && item.category !== 'Item') {
          subGroupName = item.category;
        }

        if (!groups[subGroupName]) groups[subGroupName] = [];
        groups[subGroupName].push(item);
      });

      return groups;
    }

    function buildFilterTabs() {
      const tabsContainer = document.getElementById('filter-tabs');
      tabsContainer.innerHTML = `<button class="tab-btn ${activeFilter === 'all' ? 'active' : ''}" onclick="filterCategory('all', this)">${textDict[currentLang].allTab}</button>`;

      for (const sectionName of Object.keys(rawShopData)) {
        tabsContainer.innerHTML += `<button class="tab-btn ${activeFilter === sectionName ? 'active' : ''}" onclick="filterCategory('${sectionName}', this)">${sectionName}</button>`;
      }
    }

    function filterCategory(categoryName, btnElement) {
      activeFilter = categoryName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      renderMatrix();
    }

    function renderMatrix() {
      const container = document.getElementById('matrix-container');
      if (!rawShopData || Object.keys(rawShopData).length === 0) {
        container.innerHTML = `<div class="system-status-msg">${textDict[currentLang].empty}</div>`;
        return;
      }

      container.innerHTML = '';

      const sectionsToRender = activeFilter === 'all' ? Object.entries(rawShopData) : [[activeFilter, rawShopData[activeFilter]]];

      for (const [sectionName, items] of sectionsToRender) {
        if (!Array.isArray(items)) continue;

        const subGroups = groupItemsIntelligently(items);

        for (const [subTitle, subItems] of Object.entries(subGroups)) {
          const cardsHtml = subItems.map(item => `
            <div class="gaming-card">
              <div class="card-media">
                <img src="${item.image || 'https://via.placeholder.com/300x200?text=Rocket+League'}" alt="${item.name || 'Item'}">
              </div>
              <div class="card-content">
                <div>
                  <div class="item-name" title="${item.name || ''}">${item.name || 'Unknown'}</div>
                  <div class="item-category">${item.category || ''}</div>
                </div>
                <div class="item-price-badge">${item.price || 0} CR</div>
              </div>
            </div>
          `).join('');

          const blockDiv = document.createElement('div');
          blockDiv.className = 'section-block';
          blockDiv.innerHTML = `
            <div class="block-title">
              <span class="title-text">✦ ${sectionName} ${subTitle !== "عنصر فردي / General" ? `‹ ${subTitle}` : ''}</span>
              <span class="count">${subItems.length} ${textDict[currentLang].items}</span>
            </div>
            <div class="items-matrix-grid">${cardsHtml}</div>
          `;
          
          container.appendChild(blockDiv);
        }
      }
    }

    function startCountdown() {
      const timerElem = document.getElementById('countdown');
      setInterval(() => {
        const now = new Date();
        const nextReset = new Date();
        nextReset.setUTCHours(20, 0, 0, 0);
        if (now > nextReset) nextReset.setUTCDate(nextReset.getUTCDate() + 1);
        const diff = nextReset - now;
        const h = Math.floor((diff / (1000 * 60 * 60)) % 24).toString().padStart(2, '0');
        const m = Math.floor((diff / (1000 * 60)) % 60).toString().padStart(2, '0');
        const s = Math.floor((diff / 1000) % 60).toString().padStart(2, '0');
        timerElem.innerText = `${h}:${m}:${s}`;
      }, 1000);
    }

    fetchShopData();
    startCountdown();
  </script>
</body>
</html>
