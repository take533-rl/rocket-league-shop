<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RL-X // Nexus Item Shop Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-core: #04070e;
      --panel-glass: rgba(11, 19, 33, 0.75);
      --card-bg: #0d1729;
      --card-hover: #14223b;
      --accent-neon: #00ffcc;
      --accent-glow: rgba(0, 255, 204, 0.2);
      --accent-pink: #ff0055;
      --accent-orange: #ff6600;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --border-cyber: rgba(0, 255, 204, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

    body {
      background-color: var(--bg-core);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 255, 204, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(255, 0, 85, 0.04) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 20px;
    }

    .nexus-wrapper {
      max-width: 1450px;
      margin: 0 auto;
    }

    /* --- NEXUS TOP HEADER --- */
    .nexus-header {
      background: var(--panel-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-cyber);
      border-radius: 24px;
      padding: 24px 35px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      flex-wrap: wrap;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }

    .nexus-header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, var(--accent-neon), var(--accent-pink));
    }

    .brand-box h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent-neon);
      letter-spacing: 1.5px;
      text-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
    }

    .brand-box p {
      color: var(--text-muted);
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 255, 204, 0.06);
      border: 1px solid rgba(0, 255, 204, 0.2);
      padding: 8px 16px;
      border-radius: 50px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-neon);
    }

    .pulse-dot {
      width: 7px; height: 7px;
      background: var(--accent-neon);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-neon);
      animation: blink 1.5s infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .timer-pill {
      background: rgba(255, 102, 0, 0.08);
      border: 1px solid rgba(255, 102, 0, 0.25);
      color: var(--accent-orange);
      padding: 8px 18px;
      border-radius: 14px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .lang-btn {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid var(--border-cyber);
      color: var(--accent-neon);
      padding: 10px 22px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .lang-btn:hover {
      background: var(--accent-neon);
      color: var(--bg-core);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    /* --- FILTER NAVIGATION TABS --- */
    .nexus-tabs {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 15px;
      margin-bottom: 30px;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-neon) var(--panel-glass);
    }

    .tab-item {
      background: var(--panel-glass);
      border: 1px solid var(--border-cyber);
      color: var(--text-muted);
      padding: 12px 26px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s ease;
    }

    .tab-item:hover, .tab-item.active {
      background: rgba(0, 255, 204, 0.08);
      border-color: var(--accent-neon);
      color: var(--accent-neon);
      box-shadow: 0 0 20px var(--accent-glow);
      transform: translateY(-2px);
    }

    /* --- SHOP MATRIX CONTAINER --- */
    .matrix-layout {
      display: flex;
      flex-direction: column;
      gap: 35px;
    }

    .category-section {
      background: var(--panel-glass);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .category-heading {
      font-size: 1.3rem;
      color: var(--accent-neon);
      margin-bottom: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--border-cyber);
      padding-bottom: 12px;
      font-weight: 700;
    }

    .category-heading span.badge {
      background: rgba(0, 255, 204, 0.1);
      color: var(--accent-neon);
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.85rem;
      padding: 3px 12px;
      border-radius: 8px;
    }

    /* --- CARDS GRID & ITEM CARD --- */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 22px;
    }

    .nexus-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nexus-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent-pink);
      box-shadow: 0 12px 30px rgba(255, 0, 85, 0.2);
      background: var(--card-hover);
    }

    .card-media-box {
      width: 100%;
      height: 180px;
      background: #020408;
      position: relative;
      overflow: hidden;
    }

    .card-media-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .nexus-card:hover .card-media-box img {
      transform: scale(1.08);
    }

    .card-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
      justify-content: space-between;
      text-align: right;
    }
    body[dir="ltr"] .card-info { text-align: left; }

    .item-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-type {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 0.5px;
    }

    .item-price-tag {
      align-self: flex-start;
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-pink));
      color: #fff;
      font-weight: 800;
      font-family: 'Rajdhani', sans-serif;
      padding: 5px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
    }

    .system-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 90px;
      font-size: 1.1rem;
      font-family: 'Rajdhani', sans-serif;
    }
  </style>
</head>
<body>

  <div class="nexus-wrapper">
    <!-- Navbar التحديث الشامل -->
    <header class="nexus-header">
      <div class="brand-box">
        <h1 id="ui-title">RL-X // NEXUS HUB</h1>
        <p id="ui-subtitle">نظام تتبع وإدارة متجر روكيت ليغ المطور</p>
      </div>
      <div class="header-actions">
        <div class="status-pill">
          <span class="pulse-dot"></span>
          <span id="ui-status">LIVE SYNC</span>
        </div>
        <div class="timer-pill" id="countdown">--:--:--</div>
        <button class="lang-btn" onclick="toggleLanguage()" id="lang-btn">ENGLISH</button>
      </div>
    </header>

    <!-- أزرار الفلترة المحدثة -->
    <nav class="nexus-tabs" id="filter-tabs">
      <button class="tab-item active" onclick="switchFilter('all', this)" id="tab-all">الكل / ALL</button>
    </nav>

    <!-- شبكة عرض العناصر الأساسية -->
    <main class="matrix-layout" id="nexus-container">
      <div class="system-msg" id="ui-loading">جاري تهيئة نواة النظام وسحب بيانات المتجر...</div>
    </main>
  </div>

  <script>
    let currentLang = 'ar';
    let rawShopData = {};
    let activeFilter = 'all';

    const langData = {
      ar: {
        title: "RL-X // NEXUS HUB",
        subtitle: "نظام تتبع وإدارة متجر روكيت ليغ المطور",
        status: "متصل نشط",
        loading: "جاري تهيئة نواة النظام وسحب بيانات المتجر...",
        empty: "لا توجد عناصر متاحة في المتجر حالياً.",
        error: "فشل الاتصال بخوادم السيرفر.",
        allTab: "الكل / ALL",
        langBtn: "ENGLISH",
        itemsCount: "عنصر"
      },
      en: {
        title: "RL-X // NEXUS HUB",
        subtitle: "Next-Gen Rocket League Shop Tracker",
        status: "LIVE SYNC",
        loading: "Initializing nexus core & fetching shop data...",
        empty: "No items available in the shop right now.",
        error: "Failed to connect to core servers.",
        allTab: "ALL ITEMS",
        langBtn: "عربي",
        itemsCount: "Items"
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      document.body.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      
      document.getElementById('ui-title').innerText = langData[currentLang].title;
      document.getElementById('ui-subtitle').innerText = langData[currentLang].subtitle;
      document.getElementById('ui-status').innerText = langData[currentLang].status;
      document.getElementById('tab-all').innerText = langData[currentLang].allTab;
      document.getElementById('lang-btn').innerText = langData[currentLang].langBtn;
      
      renderNexusShop();
    }

    async function fetchShopData() {
      try {
        const response = await fetch('/api/shop');
        if (!response.ok) throw new Error();
        const data = await response.json();
        
        if (data.categories) {
          rawShopData = data.categories;
        } else if (Array.isArray(data)) {
          rawShopData = { "عناصر المتجر اليومي / Featured": data };
        } else {
          rawShopData = data;
        }

        buildTabs();
        renderNexusShop();
      } catch (err) {
        document.getElementById('nexus-container').innerHTML = `<div class="system-msg" style="color: var(--accent-pink);">${langData[currentLang].error}</div>`;
      }
    }

    // دالة الفرز الذكية لتصنيف الفرق والحزم بشكل مستقل ونظيف
    function smartGroupItems(items) {
      const groups = {};
      
      items.forEach(item => {
        let name = (item.name || '').trim();
        let nameLower = name.toLowerCase();
        let groupName = "عناصر رئيسية / Main Items";

        const teamsList = [
          "Falcons", "NRG", "G2", "Vitality", "BDS", "Furia", "Complexity", 
          "Moist", "Karmine Corp", "Liquid", "Rule One", "Spacestation", 
          "FaZe", "OG", "Gen.G", "TSM", "Cloud9", "Oxygen", "Endpoint", "KRÜ"
        ];

        let matchedTeam = teamsList.find(t => nameLower.includes(t.toLowerCase()));

        if (matchedTeam) {
          groupName = `فريق ${matchedTeam} / ${matchedTeam}`;
        } else if (nameLower.includes("bundle") || nameLower.includes("pack")) {
          groupName = name; // الحزمة تصبح قسماً مستقلاً باسمها الكامل
        } else if (name.includes(":")) {
          groupName = name.split(":")[0].trim();
        } else if (item.category && item.category !== 'Item') {
          groupName = item.category;
        }

        if (!groups[groupName]) groups[groupName] = [];
        groups[groupName].push(item);
      });

      return groups;
    }

    function buildTabs() {
      const tabsContainer = document.getElementById('filter-tabs');
      tabsContainer.innerHTML = `<button class="tab-item ${activeFilter === 'all' ? 'active' : ''}" onclick="switchFilter('all', this)">${langData[currentLang].allTab}</button>`;

      for (const sectionKey of Object.keys(rawShopData)) {
        tabsContainer.innerHTML += `<button class="tab-item ${activeFilter === sectionKey ? 'active' : ''}" onclick="switchFilter('${sectionKey}', this)">${sectionKey}</button>`;
      }
    }

    function switchFilter(key, btnElement) {
      activeFilter = key;
      document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
      btnElement.classList.add('active');
      renderNexusShop();
    }

    function renderNexusShop() {
      const container = document.getElementById('nexus-container');
      if (!rawShopData || Object.keys(rawShopData).length === 0) {
        container.innerHTML = `<div class="system-msg">${langData[currentLang].empty}</div>`;
        return;
      }

      container.innerHTML = '';

      const targetSections = activeFilter === 'all' ? Object.entries(rawShopData) : [[activeFilter, rawShopData[activeFilter]]];

      for (const [sectionName, items] of targetSections) {
        if (!Array.isArray(items)) continue;

        const subGroups = smartGroupItems(items);

        for (const [subTitle, subItems] of Object.entries(subGroups)) {
          const cardsMarkup = subItems.map(item => `
            <div class="nexus-card">
              <div class="card-media-box">
                <img src="${item.image || 'https://via.placeholder.com/300x200?text=Rocket+League'}" alt="${item.name || 'Item'}">
              </div>
              <div class="card-info">
                <div>
                  <div class="item-title" title="${item.name || ''}">${item.name || 'Unknown'}</div>
                  <div class="item-type">${item.category || ''}</div>
                </div>
                <div class="item-price-tag">${item.price || 0} CR</div>
              </div>
            </div>
          `).join('');

          const sectionBox = document.createElement('div');
          sectionBox.className = 'category-section';
          sectionBox.innerHTML = `
            <div class="category-heading">
              <span>⚡ ${sectionName} ${subTitle !== "عناصر رئيسية / Main Items" ? `‹ ${subTitle}` : ''}</span>
              <span class="badge">${subItems.length} ${langData[currentLang].itemsCount}</span>
            </div>
            <div class="cards-grid">${cardsMarkup}</div>
          `;
          
          container.appendChild(sectionBox);
        }
      }
    }

    function startCountdown() {
      const timerElement = document.getElementById('countdown');
      setInterval(() => {
        const now = new Date();
        const resetTime = new Date();
        resetTime.setUTCHours(20, 0, 0, 0);
        if (now > resetTime) resetTime.setUTCDate(resetTime.getUTCDate() + 1);
        const diff = resetTime - now;
        const h = Math.floor((diff / (1000 * 60 * 60)) % 24).toString().padStart(2, '0');
        const m = Math.floor((diff / (1000 * 60)) % 60).toString().padStart(2, '0');
        const s = Math.floor((diff / 1000) % 60).toString().padStart(2, '0');
        timerElement.innerText = `${h}:${m}:${s}`;
      }, 1000);
    }

    fetchShopData();
    startCountdown();
  </script>
</body>
</html>
