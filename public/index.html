<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RL Shop Matrix - Ultimate Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-core: #020408;
      --card-surface: #0a111c;
      --card-hover: #101c30;
      --neon-cyan: #00ffcc;
      --neon-orange: #ff5500;
      --neon-magenta: #ff0077;
      --text-main: #e2e8f0;
      --text-dim: #64748b;
      --border-line: rgba(0, 255, 204, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Changa', sans-serif; }

    body {
      background-color: var(--bg-core);
      color: var(--text-main);
      min-height: 100vh;
      padding: 25px 15px;
      overflow-x: hidden;
    }

    .app-wrapper {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* =========================================
       شريط التنقل العلوي المحدث والمقسم (Navbar)
       ========================================= */
    .cyber-nav {
      background: var(--card-surface);
      border: 1px solid var(--border-line);
      border-radius: 20px;
      padding: 18px 25px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 20px;
      margin-bottom: 35px;
      box-shadow: 0 0 35px rgba(0, 255, 204, 0.04);
    }

    @media (max-width: 900px) {
      .cyber-nav {
        grid-template-columns: 1fr;
        text-align: center;
      }
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    @media (max-width: 900px) {
      .nav-left {
        flex-direction: column;
        gap: 12px;
      }
    }

    .brand-box h1 {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--neon-cyan);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
    }

    .brand-box p {
      color: var(--text-dim);
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }

    /* مؤشر حالة السيرفر البرمجي */
    .server-status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 255, 204, 0.05);
      border: 1px solid rgba(0, 255, 204, 0.2);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-cyan);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--neon-cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--neon-cyan);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* القسم اليميني للأدوات (العداد وزر اللغة) */
    .nav-right {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    @media (max-width: 900px) {
      .nav-right {
        justify-content: center;
      }
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 6px 12px;
      border-radius: 12px;
    }

    .tool-label {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .timer-display {
      background: rgba(255, 85, 0, 0.1);
      border: 1px solid rgba(255, 85, 0, 0.3);
      color: var(--neon-orange);
      padding: 6px 14px;
      border-radius: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .lang-switcher {
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 8px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.3s;
    }
    .lang-switcher:hover {
      background: var(--neon-cyan);
      color: var(--bg-core);
      box-shadow: 0 0 15px var(--neon-cyan);
    }

    /* =========================================
       التصنيفات والشبكة (Matrix & Tabs)
       ========================================= */
    .filter-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 15px;
      margin-bottom: 25px;
      scrollbar-width: thin;
      scrollbar-color: var(--neon-cyan) var(--card-surface);
    }

    .tab-btn {
      background: var(--card-surface);
      border: 1px solid var(--border-line);
      color: var(--text-dim);
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.3s;
    }

    .tab-btn:hover, .tab-btn.active {
      background: rgba(0, 255, 204, 0.08);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
    }

    .matrix-container {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .section-block {
      background: rgba(10, 17, 28, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      padding: 25px;
    }

    .block-title {
      font-size: 1.3rem;
      color: var(--neon-cyan);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px dashed var(--border-line);
      padding-bottom: 10px;
      font-weight: 700;
    }

    .block-title span.count {
      background: rgba(0, 255, 204, 0.1);
      color: var(--neon-cyan);
      font-size: 0.8rem;
      padding: 2px 10px;
      border-radius: 6px;
      font-family: 'Share Tech Mono', monospace;
    }

    .items-matrix-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .gaming-card {
      background: var(--card-surface);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s;
    }

    .gaming-card:hover {
      transform: translateY(-8px);
      border-color: var(--neon-magenta);
      box-shadow: 0 10px 30px rgba(255, 0, 119, 0.2);
    }

    .card-media {
      width: 100%;
      height: 170px;
      background: #000;
      position: relative;
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-grow: 1;
      justify-content: space-between;
      text-align: right;
    }
    body[dir="ltr"] .card-content { text-align: left; }

    .item-name {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-category {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      font-family: 'Share Tech Mono', monospace;
    }

    .item-price-badge {
      align-self: flex-start;
      background: linear-gradient(135deg, var(--neon-orange), #ff0055);
      color: #fff;
      font-weight: 800;
      font-family: 'Share Tech Mono', monospace;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      box-shadow: 0 4px 10px rgba(255, 85, 0, 0.3);
    }

    .system-status-msg {
      text-align: center;
      color: var(--text-dim);
      padding: 80px;
      font-size: 1.1rem;
      font-family: 'Share Tech Mono', monospace;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- Navbar المقسم والمرتب حديثاً -->
    <header class="cyber-nav">
      <!-- القسم الأيسر: الشعار والحالة -->
      <div class="nav-left">
        <div class="brand-box">
          <h1 id="ui-title">RL SHOP MATRIX</h1>
          <p id="ui-subtitle">نظام المراقبة والتحليل الحي لمتجر روكيت ليغ</p>
        </div>
        <div class="server-status-badge">
          <span class="status-dot"></span>
          <span id="ui-status">LIVE SYNC ACTIVE</span>
        </div>
      </div>

      <!-- القسم اليميني: الأدوات والعداد واللغة -->
      <div class="nav-right">
        <div class="tool-group">
          <span class="tool-label" id="ui-timer-label">التحديث:</span>
          <div class="timer-display" id="countdown">00:00:00</div>
        </div>
        <button class="lang-switcher" onclick="toggleLanguage()" id="lang-btn">ENGLISH</button>
      </div>
    </header>

    <!-- Filter Navigation Tabs -->
    <nav class="filter-tabs" id="filter-tabs">
      <button class="tab-btn active" onclick="filterCategory('all', this)" id="tab-all">الكل / ALL</button>
    </nav>

    <!-- Dynamic Content Matrix -->
    <main class="matrix-container" id="matrix-container">
      <div class="system-status-msg" id="ui-loading">جاري تهيئة مصفوفة المتجر وسحب البيانات...</div>
    </main>
  </div>

  <script>
    let currentLang = 'ar';
    let rawShopData = {};
    let activeFilter = 'all';

    const textDict = {
      ar: {
        title: "RL SHOP MATRIX",
        subtitle: "نظام المراقبة والتحليل الحي لمتجر روكيت ليغ",
        status: "متصل وحي",
        timerLabel: "التحديث:",
        loading: "جاري تهيئة مصفوفة المتجر وسحب البيانات...",
        empty: "لا توجد بيانات متاحة في المصفوفة حالياً.",
        error: "فشل الاتصال بنواة السيرفر.",
        allTab: "الكل / ALL",
        langBtn: "ENGLISH",
        items: "عنصر"
      },
      en: {
        title: "RL SHOP MATRIX",
        subtitle: "Live Rocket League Shop Matrix Tracker",
        status: "LIVE SYNC ACTIVE",
        timerLabel: "Resets:",
        loading: "Initializing store matrix & fetching data...",
        empty: "No items available in the matrix right now.",
        error: "Failed to connect to core server.",
        allTab: "ALL ITEMS",
        langBtn: "عربي",
        items: "Items"
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      document.body.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      
      document.getElementById('ui-title').innerText = textDict[currentLang].title;
      document.getElementById('ui-subtitle').innerText = textDict[currentLang].subtitle;
      document.getElementById('ui-status').innerText = textDict[currentLang].status;
      document.getElementById('ui-timer-label').innerText = textDict[currentLang].timerLabel;
      document.getElementById('tab-all').innerText = textDict[currentLang].allTab;
      document.getElementById('lang-btn').innerText = textDict[currentLang].langBtn;
      
      renderMatrix();
    }

    async function fetchShopData() {
      try {
        const response = await fetch('/api/shop');
        if (!response.ok) throw new Error();
        const data = await response.json();
        
        if (data.categories) {
          rawShopData = data.categories;
        } else if (Array.isArray(data)) {
          rawShopData = { "العناصر اليومية / Daily Featured": data };
        } else {
          rawShopData = data;
        }

        buildFilterTabs();
        renderMatrix();
      } catch (err) {
        document.getElementById('matrix-container').innerHTML = `<div class="system-status-msg" style="color: var(--neon-magenta);">${textDict[currentLang].error}</div>`;
      }
    }

    function groupItemsIntelligently(items) {
      const groups = {};
      
      items.forEach(item => {
        let name = (item.name || '').trim();
        let nameLower = name.toLowerCase();
        let subGroupName = "عنصر فردي / General";

        const teamsList = [
          "Falcons", "NRG", "G2", "Vitality", "BDS", "Furia", "Complexity", 
          "Moist", "Karmine Corp", "Liquid", "Rule One", "Spacestation", 
          "FaZe", "OG", "Gen.G", "TSM", "Cloud9", "Oxygen", "Endpoint", "KRÜ"
        ];

        let foundTeam = teamsList.find(t => nameLower.includes(t.toLowerCase()));

        if (foundTeam) {
          subGroupName = `فريق ${foundTeam} / ${foundTeam}`;
        } else if (nameLower.includes("bundle") || nameLower.includes("pack")) {
          subGroupName = name;
        } else if (name.includes(":")) {
          subGroupName = name.split(":")[0].trim();
        } else if (item.category && item.category !== 'Item') {
          subGroupName = item.category;
        }

        if (!groups[subGroupName]) groups[subGroupName] = [];
        groups[subGroupName].push(item);
      });

      return groups;
    }

    function buildFilterTabs() {
      const tabsContainer = document.getElementById('filter-tabs');
      tabsContainer.innerHTML = `<button class="tab-btn ${activeFilter === 'all' ? 'active' : ''}" onclick="filterCategory('all', this)">${textDict[currentLang].allTab}</button>`;

      for (const sectionName of Object.keys(rawShopData)) {
        tabsContainer.innerHTML += `<button class="tab-btn ${activeFilter === sectionName ? 'active' : ''}" onclick="filterCategory('${sectionName}', this)">${sectionName}</button>`;
      }
    }

    function filterCategory(categoryName, btnElement) {
      activeFilter = categoryName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      renderMatrix();
    }

    function renderMatrix() {
      const container = document.getElementById('matrix-container');
      if (!rawShopData || Object.keys(rawShopData).length === 0) {
        container.innerHTML = `<div class="system-status-msg">${textDict[currentLang].empty}</div>`;
        return;
      }

      container.innerHTML = '';

      const sectionsToRender = activeFilter === 'all' ? Object.entries(rawShopData) : [[activeFilter, rawShopData[activeFilter]]];

      for (const [sectionName, items] of sectionsToRender) {
        if (!Array.isArray(items)) continue;

        const subGroups = groupItemsIntelligently(items);

        for (const [subTitle, subItems] of Object.entries(subGroups)) {
          const cardsHtml = subItems.map(item => `
            <div class="gaming-card">
              <div class="card-media">
                <img src="${item.image || 'https://via.placeholder.com/300x200?text=Rocket+League'}" alt="${item.name || 'Item'}">
              </div>
              <div class="card-content">
                <div>
                  <div class="item-name" title="${item.name || ''}">${item.name || 'Unknown'}</div>
                  <div class="item-category">${item.category || ''}</div>
                </div>
                <div class="item-price-badge">${item.price || 0} CR</div>
              </div>
            </div>
          `).join('');

          const blockDiv = document.createElement('div');
          blockDiv.className = 'section-block';
          blockDiv.innerHTML = `
            <div class="block-title">
              <span>✦ ${sectionName} ${subTitle !== "عنصر فردي / General" ? `‹ ${subTitle}` : ''}</span>
              <span class="count">${subItems.length} ${textDict[currentLang].items}</span>
            </div>
            <div class="items-matrix-grid">${cardsHtml}</div>
          `;
          
          container.appendChild(blockDiv);
        }
      }
    }

    function startCountdown() {
      const timerElem = document.getElementById('countdown');
      setInterval(() => {
        const now = new Date();
        const nextReset = new Date();
        nextReset.setUTCHours(20, 0, 0, 0);
        if (now > nextReset) nextReset.setUTCDate(nextReset.getUTCDate() + 1);
        const diff = nextReset - now;
        const h = Math.floor((diff / (1000 * 60 * 60)) % 24).toString().padStart(2, '0');
        const m = Math.floor((diff / (1000 * 60)) % 60).toString().padStart(2, '0');
        const s = Math.floor((diff / 1000) % 60).toString().padStart(2, '0');
        timerElem.innerText = `${h}:${m}:${s}`;
      }, 1000);
    }

    fetchShopData();
    startCountdown();
  </script>
</body>
</html>
